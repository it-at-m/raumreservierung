id: add roles
author: Default
realm: local_realm
changes:
  - addRole:
      name: anwender
      description: Role to view and write only the own bookings
      clientRole: true
      clientId: local
      composite: false

  - addRole:
      name: raumadmin
      description: Role to view and write all bookings and access to other administrative areas
      clientRole: true
      clientId: local
      composite: false