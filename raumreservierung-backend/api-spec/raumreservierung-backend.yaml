openapi: 3.0.1
info:
  title: raumreservierung-backend
  description: This is the backend-project of the renewal of the raumreservierung
  version: 0.4.1-SNAPSHOT
servers:
- url: http://localhost:8086
  description: Generated server url
tags:
- name: Actuator
  description: Monitor and interact
  externalDocs:
    description: Spring Boot Actuator Web API Documentation
    url: https://docs.spring.io/spring-boot/docs/current/actuator-api/html/
paths:
  /seating/{seatingTypeId}:
    put:
      tags:
      - seating-controller
      summary: Update an existing Seating entity.
      description: |-
        Update an existing Seating entity.
         Updates an existing Seating resource using the provided details.
      operationId: updateSeatingType
      parameters:
      - name: seatingTypeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: the updated Seating details
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeatingTypeRequestDto"
        required: true
      responses:
        "200":
          description: the updated Seating as response DTO
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SeatingTypeResponseDto"
    delete:
      tags:
      - seating-controller
      summary: Delete an Seating entity.
      description: |-
        Delete an Seating entity.
         Deletes the Seating resource identified by the given UUID.
      operationId: deleteSeatingType
      parameters:
      - name: seatingTypeId
        in: path
        description: the UUID of the Seating to delete
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /rooms/{roomId}:
    get:
      tags:
      - room-controller
      operationId: getRoom
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoomDetailsResponseDTO"
    put:
      tags:
      - room-controller
      operationId: updateRoom
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomRequestDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoomDetailsResponseDTO"
    delete:
      tags:
      - room-controller
      operationId: deleteRoom
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /person/{personId}:
    get:
      tags:
      - person-controller
      operationId: findById
      parameters:
      - name: personId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: "#/components/schemas/ExternalPersonResponseDto"
                - $ref: "#/components/schemas/InternalPersonResponseDto"
    put:
      tags:
      - person-controller
      operationId: updatePerson
      parameters:
      - name: personId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: "#/components/schemas/ExternalPersonRequestDto"
              - $ref: "#/components/schemas/InternalPersonRequestDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: "#/components/schemas/ExternalPersonResponseDto"
                - $ref: "#/components/schemas/InternalPersonResponseDto"
    delete:
      tags:
      - person-controller
      operationId: deletePerson
      parameters:
      - name: personId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /holidays/{id}:
    put:
      tags:
      - holiday-controller
      operationId: updateHoliday
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HolidayRequestDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HolidayResponseDTO"
    delete:
      tags:
      - holiday-controller
      operationId: deleteHoliday
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /equipment/{equipmentId}:
    put:
      tags:
      - equipment-controller
      summary: Update an existing equipment entity.
      description: |-
        Update an existing equipment entity.
         Updates an existing equipment resource using the provided details.
      operationId: updateEquipment
      parameters:
      - name: equipmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: the updated equipment details
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipmentRequestDto"
        required: true
      responses:
        "200":
          description: the updated equipment as response DTO
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EquipmentResponseDto"
    delete:
      tags:
      - equipment-controller
      summary: Delete an equipment entity.
      description: |-
        Delete an equipment entity.
         Deletes the equipment resource identified by the given UUID.
      operationId: deleteEquipment
      parameters:
      - name: equipmentId
        in: path
        description: the UUID of the equipment to delete
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /bookings/{bookingId}:
    get:
      tags:
      - booking-controller
      operationId: getBooking
      parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BookingDetailResponseDTO"
    put:
      tags:
      - booking-controller
      operationId: updateBooking
      parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingRequestDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BookingDetailResponseDTO"
    delete:
      tags:
      - booking-controller
      operationId: deleteBooking
      parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /appointments/{appointmentId}:
    put:
      tags:
      - appointment-controller
      operationId: updateAppointment
      parameters:
      - name: appointmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentRequestDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AppointmentResponseDTO"
    delete:
      tags:
      - appointment-controller
      operationId: deleteAppointment
      parameters:
      - name: appointmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /seating:
    get:
      tags:
      - seating-controller
      summary: Retrieve all Seating entities.
      description: |-
        Retrieve all Seating entities.
         Returns a list of all existing Seating resources.
      operationId: getAllSeatingTypes
      responses:
        "200":
          description: list of Seating as response DTOs
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SeatingTypeResponseDto"
    post:
      tags:
      - seating-controller
      summary: Create a new Seating entity.
      description: |-
        Create a new Seating entity.
         Creates a new Seating resource using the provided details.
      operationId: createSeatingType
      requestBody:
        description: the details of the Seating to create
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeatingTypeRequestDto"
        required: true
      responses:
        "201":
          description: the created Seating as response DTO
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SeatingTypeResponseDto"
  /rooms:
    get:
      tags:
      - room-controller
      operationId: getAllRooms
      parameters:
      - name: onlyActive
        in: query
        required: false
        schema:
          type: boolean
          default: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomListResponseDTO"
    post:
      tags:
      - room-controller
      operationId: createRoom
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomRequestDTO"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoomDetailsResponseDTO"
  /person:
    get:
      tags:
      - person-controller
      operationId: getPersonsByPageableAndFilter
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          minimum: 0
          type: integer
          default: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          minimum: 1
          type: integer
          default: 20
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          items:
            type: string
      - name: searchName
        in: query
        required: false
        schema:
          type: string
      - name: personType
        in: query
        required: false
        schema:
          type: string
          enum:
          - INTERNAL
          - EXTERNAL
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelPersonResponseDto"
    post:
      tags:
      - person-controller
      operationId: createPerson
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: "#/components/schemas/ExternalPersonRequestDto"
              - $ref: "#/components/schemas/InternalPersonRequestDto"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: "#/components/schemas/ExternalPersonResponseDto"
                - $ref: "#/components/schemas/InternalPersonResponseDto"
  /holidays:
    get:
      tags:
      - holiday-controller
      operationId: getHolidays
      parameters:
      - name: year
        in: query
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HolidayResponseDTO"
    post:
      tags:
      - holiday-controller
      operationId: createHoliday
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HolidayRequestDTO"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HolidayResponseDTO"
  /equipment:
    get:
      tags:
      - equipment-controller
      summary: Retrieve all equipment entities.
      description: |-
        Retrieve all equipment entities.
         Returns a list of all existing equipment resources.
      operationId: getAllEquipments
      responses:
        "200":
          description: list of equipment as response DTOs
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EquipmentResponseDto"
    post:
      tags:
      - equipment-controller
      summary: Create a new equipment entity.
      description: |-
        Create a new equipment entity.
         Creates a new equipment resource using the provided details.
      operationId: createEquipment
      requestBody:
        description: the details of the equipment to create
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipmentRequestDto"
        required: true
      responses:
        "201":
          description: the created equipment as response DTO
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EquipmentResponseDto"
  /bookings:
    get:
      tags:
      - booking-controller
      operationId: getBookingsByPageableAndFilter
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          minimum: 0
          type: integer
          default: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          minimum: 1
          type: integer
          default: 20
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          items:
            type: string
      - name: roomId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: start
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: end
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: status
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - NEW
            - ROOM_APPROVED
            - ROOM_CHANGED
            - COORDINATION_NEEDED
            - ORGANIZER_APPROVED
            - ORGANIZER_CHANGED
            - UNFEASIBLE
            - CANCELED
      - name: self
        in: query
        required: false
        schema:
          type: boolean
          default: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelBookingListResponseDTO"
    post:
      tags:
      - booking-controller
      operationId: createBooking
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingRequestDTO"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BookingDetailResponseDTO"
  /appointments:
    get:
      tags:
      - appointment-controller
      operationId: getAppointmentsByPageableAndFilter
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          minimum: 0
          type: integer
          default: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          minimum: 1
          type: integer
          default: 20
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          items:
            type: string
      - name: startDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: bookingId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: roomIds
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelAppointmentDetailsResponseDTO"
  /actuator:
    get:
      tags:
      - Actuator
      summary: Actuator root web endpoint
      operationId: links
      responses:
        "200":
          description: OK
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
  /actuator/sbom:
    get:
      tags:
      - Actuator
      summary: Actuator web endpoint 'sbom'
      operationId: sboms
      responses:
        "200":
          description: OK
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/json:
              schema:
                type: object
  /actuator/sbom/{id}:
    get:
      tags:
      - Actuator
      summary: Actuator web endpoint 'sbom-id'
      operationId: sbom
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/octet-stream:
              schema:
                type: object
        "404":
          description: Not Found
  /actuator/metrics:
    get:
      tags:
      - Actuator
      summary: Actuator web endpoint 'prometheus'
      operationId: scrape
      parameters:
      - name: format
        in: query
        schema:
          type: string
          enum:
          - CONTENT_TYPE_004
          - CONTENT_TYPE_OPENMETRICS_100
          - CONTENT_TYPE_PROTOBUF
      - name: includedNames
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            text/plain;version=0.0.4;charset=utf-8:
              schema:
                type: object
            application/openmetrics-text;version=1.0.0;charset=utf-8:
              schema:
                type: object
            application/vnd.google.protobuf;proto=io.prometheus.client.MetricFamily;encoding=delimited:
              schema:
                type: object
  /actuator/info:
    get:
      tags:
      - Actuator
      summary: Actuator web endpoint 'info'
      operationId: info
      responses:
        "200":
          description: OK
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/json:
              schema:
                type: object
  /actuator/health:
    get:
      tags:
      - Actuator
      summary: Actuator web endpoint 'health'
      operationId: health
      responses:
        "200":
          description: OK
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/json:
              schema:
                type: object
components:
  schemas:
    SeatingTypeRequestDto:
      required:
      - isActive
      - name
      type: object
      properties:
        name:
          maxLength: 100
          minLength: 2
          type: string
        description:
          type: string
        isActive:
          type: boolean
    SeatingTypeResponseDto:
      required:
      - description
      - isActive
      - name
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          maxLength: 100
          minLength: 2
          type: string
        description:
          maxLength: 255
          minLength: 0
          type: string
        isActive:
          type: boolean
    RoomRequestDTO:
      required:
      - isActive
      - name
      - number
      type: object
      properties:
        name:
          maxLength: 100
          minLength: 2
          type: string
        number:
          maxLength: 10
          minLength: 0
          type: string
        location:
          maxLength: 255
          minLength: 0
          type: string
        locationDescription:
          maxLength: 500
          minLength: 0
          type: string
        capacity:
          type: integer
          format: int32
        isActive:
          type: boolean
        area:
          type: integer
          format: int32
        roomSeatingCapacities:
          type: array
          items:
            $ref: "#/components/schemas/SeatingCapacityRequestDTO"
        equipmentIds:
          type: array
          items:
            type: string
            format: uuid
        contactPersonId:
          type: string
          format: uuid
    SeatingCapacityRequestDTO:
      required:
      - capacity
      - seatingTypeId
      type: object
      properties:
        seatingTypeId:
          type: string
          format: uuid
        capacity:
          type: integer
          format: int32
    EquipmentResponseDto:
      required:
      - description
      - isActive
      - name
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          maxLength: 100
          minLength: 2
          type: string
        description:
          maxLength: 255
          minLength: 0
          type: string
        isActive:
          type: boolean
    ExternalPersonResponseDto:
      required:
      - email
      - type
      type: object
      allOf:
      - $ref: "#/components/schemas/PersonResponseDto"
      - type: object
        properties:
          id:
            type: string
            format: uuid
          title:
            type: string
            enum:
            - NONE
            - MR
            - MS
            - DIVERSE
          firstName:
            type: string
          lastName:
            type: string
          email:
            type: string
          telefonNumber:
            type: string
          type:
            type: string
            enum:
            - INTERNAL
            - EXTERNAL
          company:
            type: string
          streetAddress:
            type: string
          postalCodeCity:
            type: string
          note:
            type: string
    InternalPersonResponseDto:
      required:
      - email
      - firstName
      - lastName
      - organisationId
      - organisationUnit
      - roleFunction
      - type
      type: object
      allOf:
      - $ref: "#/components/schemas/PersonResponseDto"
      - type: object
        properties:
          id:
            type: string
            format: uuid
          title:
            type: string
            enum:
            - NONE
            - MR
            - MS
            - DIVERSE
          firstName:
            type: string
          lastName:
            type: string
          email:
            type: string
          telefonNumber:
            type: string
          type:
            type: string
            enum:
            - INTERNAL
            - EXTERNAL
          organisationId:
            type: string
          organisationUnit:
            type: string
          roleFunction:
            type: string
    PersonResponseDto:
      required:
      - type
      type: object
      properties:
        type:
          type: string
      discriminator:
        propertyName: type
        mapping:
          INTERNAL: "#/components/schemas/InternalPersonResponseDto"
          EXTERNAL: "#/components/schemas/ExternalPersonResponseDto"
    RoomDetailsResponseDTO:
      required:
      - area
      - capacity
      - equipment
      - isActive
      - location
      - locationDescription
      - name
      - number
      - roomSeatingCapacities
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          maxLength: 100
          minLength: 2
          type: string
        number:
          maxLength: 10
          minLength: 0
          type: string
        location:
          maxLength: 255
          minLength: 0
          type: string
        locationDescription:
