id: change fachadmin to raumadmin
author: Default
realm: local_realm
changes:
  - deleteRole:
      clientId: local
      name: fachadmin

  - deleteUser:
      name: fachadmin

  - addRole:
      name: raumadmin
      description: Role to view and write all bookings and access to other administrative areas
      clientRole: true
      clientId: local
      composite: false

  - addUser:
      name: raumadmin
      lastName: raumadmin
      firstName: raumadmin
      enabled: true
      emailVerified: true
      email: raumadmin@raumadmin.de
  - updateUserPassword:
      name: raumadmin
      password: "raumadmin"

  - assignRole:
      user: raumadmin
      role: raumadmin
      clientId: local
