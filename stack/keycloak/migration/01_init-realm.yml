id: init realm
author: Default
changes:
  - addRealm:
      name: local_realm

  - addClientScope:
      realm: local_realm
      name: openid
      description: Client scope used for OpenID Connect (OIDC) based authentication

  - addClientScope:
      realm: local_realm
      name: lhm_core
      description: Used for standard attributes

  - addRealmProfileAttribute:
      realm: local_realm
      name: lhmObjectID
      displayName: LHM Object ID
      multivalued: false
      permissions:
        view:
          - admin
        edit:
          - admin

  - addRealmProfileAttribute:
      realm: local_realm
      name: preferred_username
      displayName: Preferred Username
      multivalued: false
      permissions:
        view:
          - admin
        edit:
          - admin
