id: add-client-scope-mappers
author: Default
realm: local_realm
changes:
  - addClientScopeMapper:
      clientScopeName: roles
      name: user_roles
      protocol: openid-connect
      protocolMapper: oidc-usermodel-client-role-mapper
      config:
        userinfo.token.claim: true
        access.token.claim: true
        id.token.claim: true
        claim.name: user_roles
        jsonType.label: String
        multivalued: true
        usermodel.clientRoleMapping.clientId: local
  - addClientScopeMapper:
      clientScopeName: lhm_core
      name: lhmObjectID
      protocol: openid-connect
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        user.attribute: "lhmObjectID"
        claim.name: "lhmObjectID"
        jsonType.label: "String"
        id.token.claim: true
        access.token.claim: true
        userinfo.token.claim: true
