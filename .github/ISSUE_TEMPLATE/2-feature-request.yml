name: ✨ Feature request
description: Suggest an idea or possible new feature for this project.
title: "[Feature] "
labels: ["Type: Feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature request!
        To expedite issue processing, please search open and closed issues before submitting a new one.
        Please read our [Code of Conduct](../blob/main/.github/CODE_OF_CONDUCT.md).
  - type: markdown
    attributes:
      value: "## General"
  - type: dropdown
    id: template
    attributes:
      label: Relevant template
      multiple: true
      description: Name(s) of the affected template(s) (if applicable)
      options:
        - raumreservierung-frontend
        - raumreservierung-backend
    validations:
      required: false
  - type: textarea
    id: problem-description
    attributes:
      label: Description
      description: A clear and concise description of what the new feature is
      placeholder: |
        e.g. I'm always frustrated when ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Considered alternatives (optional)
      description: A clear and concise description of any alternative solutions or features you've considered
    validations:
      required: false
  - type: markdown
    attributes:
      value: "## Confirmations"
  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](../blob/main/.github/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
