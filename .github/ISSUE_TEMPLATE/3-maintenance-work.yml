name: ⚙ Maintenance work
description: Suggest useful or required maintenance work for this project.
title: "[Maintenance] "
labels: ["Type: Maintenance"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this maintenance work issue!
        To expedite issue processing, please search open and closed issues before submitting a new one.
        Please read our [Code of Conduct](../blob/main/.github/CODE_OF_CONDUCT.md).
  - type: markdown
    attributes:
      value: "## General"
  - type: dropdown
    id: template
    attributes:
      label: Relevant template
      multiple: true
      description: Name(s) of the affected template(s) (if applicable)
      options:
        - raumreservierung-frontend
        - raumreservierung-backend
    validations:
      required: false
  - type: textarea
    id: problem-description
    attributes:
      label: Description
      description: A clear and concise description of what the maintenance work is
    validations:
      required: true
  - type: markdown
    attributes:
      value: "## Confirmations"
  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](../blob/main/.github/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
